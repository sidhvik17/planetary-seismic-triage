[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planetseis"
version = "0.1.0"
description = "Automated detection and localization of planetary seismic events with a lightweight 1D CNN"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["planetseis"]

[tool.pytest.ini_options]
# Tests import `scripts.*` from the repository root. Plain `pytest` (as in CI)
# does not add the working directory to sys.path the way `python -m pytest` does.
pythonpath = ["."]
